name: shado
description: "An application for learning English using the shadowing technique"
publish_to: 'none'
version: 0.0.2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ">=4.9.0 <4.10.0"
  just_audio: ^0.10.6
  just_waveform: ^0.0.7
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  sqflite: ^2.4.2
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any
  flutter_soloud: ^3.5.4
  sqflite_common_ffi: ">=2.4.0 <2.4.1"
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  shared_preferences: ^2.5.0
  flutter_svg: ^2.3.0

dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.13
  freezed: ">=3.0.0 <3.2.4"
  json_serializable: ">=6.9.0 <6.12.0"
  flutter_lints: ^6.0.0

  # Генераторы бренд-ассетов: запускаются вручную, в рантайме не участвуют.
  # Иконки — dart run flutter_launcher_icons; сплеш — dart run flutter_native_splash:create.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Иконки набора Shadowing — SVG-ассеты (см. lib/widgets/app_icon.dart).
  # Имя файла = значение в AppIcons, поэтому папка подключается целиком.
  assets:
    - assets/app_icons/

  # Шрифты кладём бандлом, а не через google_fonts: приложение должно
  # открываться и рисоваться одинаково без сети.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

# Иконка приложения — из вектора на фирменном градиенте (violet → magenta → pink).
# Перегенерировать: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon_1024.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  # Адаптивная иконка Android: фон-градиент + белый знак-волна.
  adaptive_icon_background: "assets/branding/adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_foreground.png" # themed icons, Android 13+
  web:
    generate: true
    image_path: "assets/branding/Icon-512.png"
    background_color: "#100E18"
    theme_color: "#7C5CFF"
  windows:
    generate: true
    image_path: "assets/branding/app_icon_1024.png"
    icon_size: 256

# Нативный сплеш: знак на тёмном фоне #100E18, показывается до движка.
# Перегенерировать: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#100E18"
  color_dark: "#100E18"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo.png
  fullscreen: true
  android: true
  ios: true
  web: false # для web сплеш рисуем Flutter-виджетом (SplashPage)
  # Android 12+: система рисует иконку в круге на цветном фоне.
  android_12:
    image: assets/branding/splash_icon_android12.png
    color: "#100E18"
    icon_background_color: "#7C5CFF"

