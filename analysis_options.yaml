# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # @JsonKey on freezed constructor parameters is copied to the generated
    # fields — the analyzer sees it as an invalid annotation target.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    # docs/ holds delivery materials (templates, samples), not app code:
    # they are not built and must not clutter the analysis.
    - "docs/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# DCM (https://dcm.dev): run with `dcm analyze lib test`.
dcm:
  rules:
    - prefer-single-widget-per-file
    - avoid-returning-widgets
    - avoid-passing-async-when-sync-expected
    - avoid-throw-in-catch-block
    - no-empty-block
    - prefer-commenting-analyzer-ignores
    # Off rules available on the Free plan; the number is the current violation count.
    # - member-ordering # 833
    # - no-magic-number # 686
    # - newline-before-return # 339
    # - prefer-static-class # 192
    # - prefer-moving-to-variable # 132
    # - avoid-non-null-assertion # 125
    # - avoid-late-keyword # 71
    # - prefer-match-file-name # 66
    # - avoid-dynamic # 26
    # - avoid-top-level-members-in-tests # 23
    # - avoid-nested-conditional-expressions # 17
    # - binary-expression-operand-order # 16
    # - prefer-correct-edge-insets-constructor # 12
    # - prefer-immutable-bloc-state # 10 (no bloc in the project)
    # - avoid-substring # 9
    # - prefer-extracting-callbacks # 8
    # - prefer-sealed-bloc-state # 6 (no bloc in the project)
    # - prefer-first # 6
    # - double-literal-format # 4
    # - avoid-wrapping-in-padding # 3
    # - avoid-unused-parameters # 3
    # - prefer-const-border-radius # 2
    # - prefer-async-await # 2
    # - avoid-shrink-wrap-in-lists # 2
    # - avoid-passing-self-as-argument # 2
    # - avoid-incomplete-copy-with # 2
    # - prefer-sealed-bloc-events # 1 (no bloc in the project)
    # - prefer-correct-test-file-name # 1
    # - avoid-duplicate-test-assertions # 1
    # - always-remove-listener # 1

